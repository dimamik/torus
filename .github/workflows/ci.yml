name: Elixir CI

on:
  push:
    branches: 
      - "**"

# Sets the ENV `MIX_ENV` to `test` for running tests
env:
  MIX_ENV: test

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}  # Groups workflows by branch
  cancel-in-progress: true  # Cancels previous runs when a new one starts

jobs:
  test:
    # Set up a Postgres DB service. By default, Phoenix applications
    # use Postgres. This creates a database for running tests.
    # Additional services can be defined here if required.
    services:
      db:
        image: postgres:17
        ports:
          - 5432/tcp
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: torus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      matrix:
        otp: ['28.3']  
        elixir: ['1.19.5']
    steps:
    # Step: Setup Elixir + Erlang image as the base.
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        elixir-version: ${{matrix.elixir}}

    # Step: Check out the code.
    - name: Checkout code
      uses: actions/checkout@v3

    # Step: Define how to cache deps. Restores existing cache if present.
    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v3
      env:
        cache-name: cache-elixir-deps
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-

    # Step: Define how to cache the `_build` directory. After the first run,
    # this speeds up tests runs a lot. This includes not re-compiling our
    # project's downloaded deps every run.
    - name: Cache compiled build
      id: cache-build
      uses: actions/cache@v3
      env:
        cache-name: cache-compiled-build
      with:
        path: _build
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-
          ${{ runner.os }}-mix-

    # Step: Download project dependencies. If unchanged, uses
    # the cached version.
    - name: Install dependencies
      run: mix deps.get --check-locked

    - name: Install pg_textsearch extension
      run: |
        docker exec ${{ job.services.db.id }} bash -lc "apt-get update && apt-get install -y wget && wget -q -O /tmp/pg_textsearch.deb https://github.com/timescale/pg_textsearch/releases/download/v0.5.0/pg-textsearch-postgresql-17_0.5.0-1_amd64.deb && dpkg -i /tmp/pg_textsearch.deb"
    # TODO These steps can be moved to `mix.exs`

    # Step: Compile the project treating any warnings as errors.
    # Customize this step if a different behavior is desired.
    - name: Compiles without warnings
      run: mix compile --warnings-as-errors

    # Step: Check that the checked in code has already been formatted.
    # This step fails if something was found unformatted.
    # Customize this step as desired.
    - name: Check Formatting
      run: mix format --check-formatted

    # Step: Check if credo finds any issues.
    - name: Run Credo
      run: mix credo

    - name: Check for unused dependencies
      run: mix deps.unlock --check-unused

    # Step: Run the migrations to setup test database.
    - name: Run mix ecto.migrate
      env:
        POSTGRES_URL: postgresql://postgres:postgres@localhost:${{job.services.db.ports[5432]}}/torus_test
      run: mix test.setup

    # Step: Execute the tests.
    - name: Run tests
      env:
        POSTGRES_URL: postgresql://postgres:postgres@localhost:${{job.services.db.ports[5432]}}/torus_test
      run: mix test
